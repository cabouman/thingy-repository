name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Lite template page
        run: python3 templates/lite/build.py

      - name: Push each Space its files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

          # update_space <space> <src:dest>... - clone the Space, lay the
          # named files on top, commit onto its history (never force-push).
          update_space () {
            space="$1"; shift
            dir=$(mktemp -d)
            git clone --quiet "https://cabouman:$HF_TOKEN@huggingface.co/spaces/$space" "$dir"
            for pair in "$@"; do cp "${pair%%:*}" "$dir/${pair##*:}"; done
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then
              echo "$space: no changes."
            else
              git -C "$dir" commit --quiet -m "Deploy from GitHub commit $GITHUB_SHA"
              git -C "$dir" push --quiet
            fi
          }

          update_space cabouman/thingy-repository \
            .hf/README.md:README.md \
            index.html:index.html \
            preview.png:preview.png \
            claude-instructions.md:claude-instructions.md \
            python-thingy-guide.md:python-thingy-guide.md

          update_space cabouman/thingy-template-lite \
            templates/lite/README.md:README.md \
            templates/lite/index.html:index.html \
            templates/lite/build.py:build.py \
            templates/app.py:app.py \
            templates/icon.png:icon.png

          update_space cabouman/thingy-template \
            templates/server/README.md:README.md \
            templates/server/requirements.txt:requirements.txt \
            templates/app.py:app.py \
            templates/icon.png:icon.png
