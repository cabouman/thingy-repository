<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Joke Machine</title>
    <script>
      // THE ONE LINE TO EDIT: the address where the thingy lives.
      const THINGY_URL = "https://cabouman.github.io/joke-machine/";
    </script>
    <style>
      html, body { margin: 0; height: 100%; }
      iframe { border: 0; width: 100%; height: 100%; display: block; }
      .fallback {
        position: fixed; bottom: 8px; right: 12px;
        font-family: sans-serif; font-size: 12px;
        background: rgba(255,255,255,0.85); color: #333;
        padding: 4px 10px; border-radius: 999px; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <iframe id="frame" allow="camera; microphone; fullscreen" allowfullscreen></iframe>
    <a id="direct" class="fallback" target="_blank" rel="noopener">open directly &#8599;</a>
    <script>
      document.getElementById("frame").src = THINGY_URL;
      document.getElementById("direct").href = THINGY_URL;
    </script>
  </body>
</html>
